# Stack ServerBDD privée pour application Android
# Usage: docker compose -f docker-compose.serverbdd.yml --env-file env.serverbdd.example up --build

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-abstergo}
      MYSQL_USER: ${MYSQL_USER:-abstergo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?define MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?define MYSQL_ROOT_PASSWORD}
    volumes:
      - serverbdd_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '--silent']
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  serverbdd:
    build:
      context: ..
      dockerfile: Docker/Dockerfile.serverbdd
    restart: unless-stopped
    ports:
      - '${SERVERBDD_PUBLISH_PORT:-5175}:5175'
    environment:
      PORT: 5175
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_NAME: ${MYSQL_DATABASE:-abstergo}
      DATABASE_USER: ${MYSQL_USER:-abstergo}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:?define MYSQL_PASSWORD}
      DATABASE_SSL: 'false'
      COGNITO_ISSUER: ${COGNITO_ISSUER:?define COGNITO_ISSUER}
      COGNITO_AUDIENCE: ${COGNITO_AUDIENCE:?define COGNITO_AUDIENCE}
      SIGNALING_INTERNAL_TOKEN: ${SIGNALING_INTERNAL_TOKEN:-}
      PLATFORM_ADMIN_TOKEN: ${PLATFORM_ADMIN_TOKEN:-}
      NODE_ENV: ${NODE_ENV:-development}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-}
      ADMIN_SIGNALING_URL: ${ADMIN_SIGNALING_URL:-}
      SIGNALING_ADMIN_TOKEN: ${SIGNALING_ADMIN_TOKEN:-}
      ADMIN_DIAGNOSTICS_URL: ${ADMIN_DIAGNOSTICS_URL:-}
      ERROR_ADMIN_TOKEN: ${ERROR_ADMIN_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  serverbdd_mysql_data:
