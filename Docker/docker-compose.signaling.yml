# Signalisation WebSocket uniquement (Server/server.js — Socket.IO)
# Depuis ce dossier :
#   docker compose -f docker-compose.signaling.yml up --build
# Avec fichier d’env dédié :
#   docker compose -f docker-compose.signaling.yml --env-file env.signaling.example up --build

services:
  signaling:
    build:
      context: ..
      dockerfile: Docker/Dockerfile.signaling
    restart: unless-stopped
    ports:
      - '${SIGNALING_PUBLISH_PORT:-5174}:5174'
    environment:
      SIGNALING_PORT: 5174
      SOCKET_IO_PATH: /socket.io
      MEMORY_ONLY_MODE: ${MEMORY_ONLY_MODE:-false}
      # La persistance MySQL est active quand l’URL et le jeton du service sont renseignés.
      DISABLE_BDD: ${DISABLE_BDD:-false}
      BDD_URL: ${BDD_URL:-http://host.docker.internal:5175}
      SIGNALING_INTERNAL_TOKEN: ${SIGNALING_INTERNAL_TOKEN:-}
      SIGNALING_ADMIN_TOKEN: ${SIGNALING_ADMIN_TOKEN:-}
      SIGNALING_PERSISTENCE_SCOPE: ${SIGNALING_PERSISTENCE_SCOPE:-local}
      REQUIRE_PLAYER_PLATFORM: ${REQUIRE_PLAYER_PLATFORM:-false}
      DIAGNOSTICS_SERVER_URL: ${DIAGNOSTICS_SERVER_URL:-}
      DIAGNOSTICS_SERVER_TOKEN: ${DIAGNOSTICS_SERVER_TOKEN:-}
